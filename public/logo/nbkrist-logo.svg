<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 500" width="100%" height="100%">
  <defs>
    <!-- Upper arc for text -->
    <path id="upper-text-path" d="M 85,240 A 160,160 0 1,1 415,240" fill="none" />
    <!-- Lower arc for text -->
    <path id="lower-text-path" d="M 120,260 A 160,160 0 0,0 380,260" fill="none" />
  </defs>

  <g transform="translate(0, -10)">
    <!-- Outer Gear Cogs Outer Ring -->
    <circle cx="250" cy="240" r="198" fill="none" stroke="#071638" stroke-width="12" stroke-dasharray="18 10" />
    <circle cx="250" cy="240" r="190" fill="#ffffff" stroke="#071638" stroke-width="4" />

    <!-- Outer Concentric Ring -->
    <circle cx="250" cy="240" r="184" fill="none" stroke="#071638" stroke-width="3" />
    <!-- Inner Concentric Ring -->
    <circle cx="250" cy="240" r="128" fill="none" stroke="#071638" stroke-width="3" />

    <!-- Text Along Upper & Lower Curved Paths -->
    <text font-family="'Plus Jakarta Sans', Arial, sans-serif" font-size="16.5" font-weight="900" fill="#071638" letter-spacing="1.8">
      <textPath href="#upper-text-path" startOffset="50%" text-anchor="middle">
        N.B.K.R. INSTITUTE OF SCIENCE AND TECHNOLOGY
      </textPath>
    </text>
    <text font-family="'Plus Jakarta Sans', Arial, sans-serif" font-size="15.5" font-weight="900" fill="#071638" letter-spacing="3.5">
      <textPath href="#lower-text-path" startOffset="50%" text-anchor="middle">
        VIDYANAGAR
      </textPath>
    </text>

    <!-- Center Atom Core & Orbits -->
    <g transform="translate(250, 240)">
      <!-- Three Interlocking Elliptical Orbits -->
      <ellipse cx="0" cy="0" rx="88" ry="34" fill="none" stroke="#071638" stroke-width="3.5" transform="rotate(0)" />
      <ellipse cx="0" cy="0" rx="88" ry="34" fill="none" stroke="#071638" stroke-width="3.5" transform="rotate(60)" />
      <ellipse cx="0" cy="0" rx="88" ry="34" fill="none" stroke="#071638" stroke-width="3.5" transform="rotate(120)" />

      <!-- Center Lamp / Diya Base -->
      <path d="M -22,8 C -22,20 22,20 22,8 C 16,8 10,12 0,12 C -10,12 -16,8 -22,8 Z" fill="#071638" />
      <path d="M -14,20 L 14,20 L 18,24 L -18,24 Z" fill="#071638" />
      <!-- Flame -->
      <path d="M 0,-18 C -7,-5 -7,4 0,7 C 7,4 7,-5 0,-18 Z" fill="#071638" />
      <path d="M 0,-11 C -3,-2 -3,3 0,5 C 3,3 3,-2 0,-11 Z" fill="#ffffff" />
    </g>

    <!-- Bottom Ribbon "WORK IS WORSHIP" -->
    <g transform="translate(250, 442)">
      <!-- Ribbon Tails -->
      <path d="M -170,8 L -140,-8 L -120,8 L -120,-8 L -150,-18 L -190,-4 Z" fill="#071638" />
      <path d="M 170,8 L 140,-8 L 120,8 L 120,-8 L 150,-18 L 190,-4 Z" fill="#071638" />
      <!-- Ribbon Banner Body -->
      <path d="M -135,-12 Q 0,-24 135,-12 L 135,16 Q 0,4 -135,16 Z" fill="#ffffff" stroke="#071638" stroke-width="3.5" />
      <!-- Motto Text -->
      <text x="0" y="5" font-family="'Plus Jakarta Sans', Arial, sans-serif" font-size="15" font-weight="900" fill="#071638" text-anchor="middle" letter-spacing="3">
        WORK IS WORSHIP
      </text>
    </g>
  </g>
</svg>
